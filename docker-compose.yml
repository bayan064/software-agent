version: '3.8'

services:
  agent-api:
    build: .
    container_name: software-agent-api
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
    volumes:
      - ./output:/app/output
    restart: unless-stopped